<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive 3D bookshelf — browse your collection, inspect books up close in 3D, and read notes with page-flip animations.">
    <title>3D Interactive Bookshelf</title>
    <link rel="canonical" href="https://bookshelf-3d-mu.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bookshelf-3d-mu.vercel.app/">
    <meta property="og:title" content="3D Interactive Bookshelf">
    <meta property="og:description" content="An interactive 3D bookshelf — browse your collection, inspect books up close in 3D, and read notes with page-flip animations.">
    <meta property="og:image" content="https://bookshelf-3d-mu.vercel.app/og-preview.jpeg">
    <meta property="og:image:secure_url" content="https://bookshelf-3d-mu.vercel.app/og-preview.jpeg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1353">
    <meta property="og:image:height" content="777">
    <meta property="og:image:alt" content="Preview of the 3D Interactive Bookshelf">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="3D Interactive Bookshelf">
    <meta name="twitter:description" content="An interactive 3D bookshelf — browse your collection, inspect books up close in 3D, and read notes with page-flip animations.">
    <meta name="twitter:image" content="https://bookshelf-3d-mu.vercel.app/og-preview.jpeg">
    <meta name="twitter:image:alt" content="Preview of the 3D Interactive Bookshelf">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <header>
        <div class="logo">
            <h1>My Library</h1>
            <div class="header-controls">
                <div class="layout-control" id="layout-control">
                    <button id="layout-toggle" class="icon-btn" title="Change shelf layout" aria-expanded="false">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                            <line x1="3" y1="7" x2="21" y2="7"/>
                            <line x1="3" y1="17" x2="21" y2="17"/>
                        </svg>
                    </button>
                    <div class="layout-popover hidden" id="layout-popover">
                        <div class="layout-popover-title">Shelf layout</div>
                        <div class="layout-popover-row">
                            <button class="layout-quick-btn" data-count="1">Single</button>
                            <button class="layout-quick-btn" data-count="2">Double</button>
                        </div>
                        <div class="layout-slider-row">
                            <label for="layout-slider">Custom &mdash; <span id="layout-slider-value">1</span> shelves</label>
                            <input type="range" id="layout-slider" min="1" max="5" step="1" value="1">
                        </div>
                    </div>
                </div>
                <button id="theme-toggle" class="icon-btn" title="Toggle light/dark theme">🌙</button>
            </div>
        </div>
        <nav>
            <ul id="tags-container" class="tags">
                <!-- Tags will be dynamically populated -->
                <li><button class="tag active" data-tag="latest">Latest 10</button></li>
                <li><button class="tag" data-tag="all">All</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="bookshelf-container" id="bookshelf-container">
            <button class="shelf-nav shelf-nav-left hidden" id="shelf-prev" aria-label="Scroll shelf left">&#8249;</button>

            <div class="bookshelf-rows" id="bookshelf-rows">
                <!-- One or more shelf rows (viewport + books + wood plank) are rendered here -->
            </div>

            <button class="shelf-nav shelf-nav-right hidden" id="shelf-next" aria-label="Scroll shelf right">&#8250;</button>
        </div>
    </main>

    <!-- Overlay for Inspect Mode -->
    <div id="inspect-overlay" class="overlay hidden">
        <div class="overlay-controls">
            <button id="close-btn" class="control-btn">Close</button>
            <div class="overlay-controls-right">
                <button id="lamp-toggle" class="control-btn lamp-btn" title="Toggle desk lamp" aria-pressed="true">
                    <span class="lamp-btn-icon">💡</span> Lamp
                </button>
                <button id="read-btn" class="control-btn primary">Read Notes</button>
            </div>
        </div>

        <div class="inspect-stage" id="inspect-stage">
            <!-- The 3D (Three.js) book viewer canvas is mounted here -->

            <div class="inspect-loader hidden" id="inspect-loader">
                <div class="spinner"></div>
            </div>

            <div class="drag-hint">Drag to rotate &middot; Scroll to zoom</div>
        </div>

        <div class="reading-interface hidden" id="reading-interface">
            <div class="open-book-container">
                <div class="open-book" id="open-book">
                    <!-- Pages will be dynamically added here -->
                </div>
            </div>
            <div class="page-controls">
                <button id="prev-page" class="nav-btn">&larr; Prev</button>
                <button id="next-page" class="nav-btn">Next &rarr;</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
